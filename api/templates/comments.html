<section class="comments-section">
    <h2>Comments</h2>

    <form class="comment-form" method="post" action="/comments">
        <input type="hidden" name="redirect_to" value="{{ request.url.path }}">
        <div class="comment-compose">
            <input type="text" name="author" placeholder="Your name" required maxlength="40">
            <textarea name="text" placeholder="Post your reply..." required maxlength="280"></textarea>
        </div>
        <div class="comment-form-footer">
            <span class="char-hint">280 characters max</span>
            <button type="submit" class="btn btn-primary">Reply</button>
        </div>
    </form>

    <div class="comment-feed">
        {% if comments %}
            {% for comment in comments %}
            <article class="comment-card">
                <div class="avatar sm">{{ comment.author[0] | upper }}</div>
                <div class="comment-body">
                    <div class="comment-meta">
                        <strong>{{ comment.author }}</strong>
                        <span>{{ comment.created_at }}</span>
                    </div>
                    <p>{{ comment.text }}</p>
                </div>
            </article>
            {% endfor %}
        {% else %}
            <p class="empty-state">No comments yet. Be the first to weigh in on the faceoff.</p>
        {% endif %}
    </div>
</section>
